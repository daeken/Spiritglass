[workspace]
resolver = "2"
members = [
    "crates/spiritglass-protocol",
    "crates/spiritglass-sdk",
    "crates/spiritglassd",
    "examples/rust-module",
    "modules/project-monitor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
spiritglass-protocol = { path = "crates/spiritglass-protocol" }
spiritglass-sdk = { path = "crates/spiritglass-sdk" }
